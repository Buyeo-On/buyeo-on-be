spring.application.name=BuyeoOnApplication
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/buyeoon}
spring.datasource.username=${DB_USERNAME:buyeoon_app}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

security.jwt.secret-base64=${JWT_SECRET}

social.kakao.app-id=${KAKAO_APP_ID}
social.kakao.api-base-url=${KAKAO_API_BASE_URL:https://kapi.kakao.com}
social.kakao.connect-timeout=${KAKAO_CONNECT_TIMEOUT:2s}
social.kakao.read-timeout=${KAKAO_READ_TIMEOUT:3s}

social.apple.enabled=${APPLE_LOGIN_ENABLED:false}
social.apple.client-id=${APPLE_CLIENT_ID:}
social.apple.team-id=${APPLE_TEAM_ID:}
social.apple.key-id=${APPLE_KEY_ID:}
social.apple.private-key-base64=${APPLE_PRIVATE_KEY_BASE64:}
social.apple.api-base-url=${APPLE_API_BASE_URL:https://appleid.apple.com}
social.apple.client-secret-ttl=${APPLE_CLIENT_SECRET_TTL:5m}
social.apple.connect-timeout=${APPLE_CONNECT_TIMEOUT:2s}
social.apple.read-timeout=${APPLE_READ_TIMEOUT:3s}

storage.images.bucket=${IMAGE_BUCKET:}
storage.images.region=${AWS_REGION:ap-northeast-2}

tourapi.base-url=${TOURAPI_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
tourapi.service-key=${TOURAPI_SERVICE_KEY:}
tourapi.area-code=${TOURAPI_AREA_CODE:34}
tourapi.signgu-code=${TOURAPI_SIGNGU_CODE:6}
tourapi.connect-timeout=${TOURAPI_CONNECT_TIMEOUT:3s}
tourapi.read-timeout=${TOURAPI_READ_TIMEOUT:5s}

admin.api-key=${ADMIN_API_KEY:}
storage.images.max-upload-bytes=${MISSION_PHOTO_MAX_UPLOAD_BYTES:10485760}
location.buyeo-boundary=${BUYEO_BOUNDARY:classpath:boundaries/buyeo-44760.geojson}

member.purge.batch-size=${MEMBER_PURGE_BATCH_SIZE:100}
member.purge.interval=${MEMBER_PURGE_INTERVAL:PT1M}
member.purge.initial-delay=${MEMBER_PURGE_INITIAL_DELAY:PT1M}

point.expiration.interval=${POINT_EXPIRATION_INTERVAL:PT1M}
point.expiration.initial-delay=${POINT_EXPIRATION_INITIAL_DELAY:PT1M}
