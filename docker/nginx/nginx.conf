user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri" $status $body_bytes_sent '
                    '"$http_user_agent" request_id=$request_id';

    access_log /var/log/nginx/access.log main;

    map $http_host $upstream_host {
        default $http_host;
        "" $host;
    }

    map $http_host $forwarded_port {
        ~:(?<buyeoon_port>[0-9]+)$ $buyeoon_port;
        default $server_port;
    }

    upstream spring_boot {
        server app:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://spring_boot;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $upstream_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location = /actuator/health {
            access_log off;
            proxy_pass http://spring_boot;
            proxy_set_header Host $upstream_host;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
