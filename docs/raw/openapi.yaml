        visitedPlaceCount:
          type: integer
          minimum: 0
        durationMinutes:
          type: integer
          minimum: 0
          description: 여행 시작부터 종료 시각까지의 분 수. 진행 중인 여행은 조회 시각까지 계산한다.
        caloriesKcal:
          type: [integer, 'null']
          minimum: 0
          description: MVP에서는 계산하지 않으므로 null이다.
    VisitRecord:
      type: object
      required: [visitId, missionId, place, visitedAt]
      properties:
