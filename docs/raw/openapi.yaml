openapi: 3.1.0
info:
  title: 부여ON API
  version: 1.0.0
  description: |
    관광데이터 유즈케이스와 도메인 모델 및 규칙을 기준으로 작성한 API 명세다.
    모든 응답은 success와 data를 가지는 공통 객체 형식을 사용한다.

    멱등성 헤더가 필요한 요청은 같은 회원, 같은 Idempotency-Key, 같은 요청 본문으로
    다시 호출하면 최초 성공 응답과 같은 상태 코드 및 응답 본문을 반환한다.
    같은 키를 다른 요청 본문에 재사용한 경우에만 409 IDEMPOTENCY_KEY_REUSED를 반환한다.
servers:
  - url: https://api.buyeoon.example.com/v1
    description: Production placeholder
tags:
  - name: Auth
  - name: Members
  - name: Terms
  - name: CitizenCards
  - name: Trips
  - name: Places
  - name: Missions
  - name: Points
  - name: Badges
  - name: Notifications
security:
  - bearerAuth: []
paths:
  /auth/social-login:
    post:
      tags: [Auth]
      summary: 소셜 로그인 또는 가입
      operationId: socialLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/SocialLoginSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/StateConflict'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: 인증 토큰 갱신
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthRefreshSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      operationId: logout
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /members/me:
    get:
      tags: [Members]
      summary: 내 회원 정보 조회
      operationId: getMyMember
      responses:
        '200':
          $ref: '#/components/responses/MemberSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Members]
      summary: 회원 탈퇴
      operationId: withdrawMember
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /members/me/social-accounts:
    post:
      tags: [Members]
      summary: 다른 소셜 계정 연결
      description: |
        현재 로그인 회원에게 OAuth 인증을 마친 소셜 계정을 연결한다.
        이미 현재 회원에게 연결된 동일한 소셜 계정은 성공으로 처리한다.
      operationId: linkSocialAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialAccountLinkRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/SocialAccountConflict'
  /members/me/profile:
    patch:
      tags: [Members]
      summary: 프로필 수정
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/MemberSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /members/me/settings:
    get:
      tags: [Members]
      summary: 서비스 설정 조회
      operationId: getMySettings
      responses:
        '200':
          $ref: '#/components/responses/SettingsSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Members]
      summary: 서비스 설정 변경
      operationId: updateMySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/SettingsSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/StateConflict'
  /terms:
    get:
      tags: [Terms]
      summary: 현재 약관 목록 조회
      operationId: getTerms
      security: []
      responses:
        '200':
          $ref: '#/components/responses/TermListSuccess'
  /members/me/term-consents:
    put:
      tags: [Terms]
      summary: 약관 동의 저장
      operationId: updateTermConsents
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermConsentRequest'
      responses:
        '200':
          $ref: '#/components/responses/TermConsentSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /citizen-cards/options:
    get:
      tags: [CitizenCards]
      summary: 군민증 캐릭터와 테마 목록 조회
      operationId: getCitizenCardOptions
      responses:
        '200':
          $ref: '#/components/responses/CitizenCardOptionsSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /citizen-cards:
    post:
      tags: [CitizenCards]
      summary: 디지털 군민증 생성
      description: 신규 회원이 필수 약관 동의를 완료하고 현재 위치가 부여 안임을 확인한 후 디지털 군민증을 생성한다.
      operationId: createCitizenCard
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenCardCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/CitizenCardSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /citizen-cards/me:
    get:
      tags: [CitizenCards]
      summary: 내 디지털 군민증 조회
      operationId: getMyCitizenCard
      responses:
        '200':
          $ref: '#/components/responses/CitizenCardSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /citizen-cards/me/barcode:
    get:
      tags: [CitizenCards]
      summary: 군민증 바코드 조회
      description: MVP 시연용 바코드를 반환하며 포인트를 차감하지 않는다.
      operationId: getMyCitizenCardBarcode
      responses:
        '200':
          $ref: '#/components/responses/BarcodeSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips:
    post:
      tags: [Trips]
      summary: 여행 시작
      description: 필수 약관에 동의하고 디지털 군민증을 발급받은 회원이 부여 안에서 여행을 시작한다.
      operationId: startTrip
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStartRequest'
      responses:
        '201':
          $ref: '#/components/responses/TripStartedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/current:
    get:
      tags: [Trips]
      summary: 진행 중 여행 조회
      operationId: getCurrentTrip
      responses:
        '200':
          $ref: '#/components/responses/CurrentTripSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{tripId}/end:
    post:
      tags: [Trips]
      summary: 여행 종료
      operationId: endTrip
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/TripEndedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{tripId}/settlement:
    put:
      tags: [Trips, Points]
      summary: 여행 포인트 정산
      description: 지정한 여행에서 적립하고 아직 정산하지 않은 포인트만 정산한다. 다른 여행에서 이월한 포인트에는 영향을 주지 않는다.
      operationId: settleTripPoints
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripSettlementRequest'
      responses:
        '200':
          $ref: '#/components/responses/TripSettlementSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{tripId}/statistics:
    get:
      tags: [Trips]
      summary: 여행 통계 조회
      description: 탐방 시간은 여행 시작부터 종료 시각까지 계산하며, 진행 중인 여행은 현재 시각까지 계산한다. MVP에서 이동 거리와 소모 칼로리는 null이다.
      operationId: getTripStatistics
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          $ref: '#/components/responses/TravelStatisticsSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{tripId}/footprint:
    get:
      tags: [Trips]
      summary: 여행 발자취 조회
      operationId: getTripFootprint
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          $ref: '#/components/responses/FootprintSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /places:
    get:
      tags: [Places]
      summary: 주변 장소 탐색
      operationId: getPlaces
      parameters:
        - $ref: '#/components/parameters/PlaceCategory'
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PlaceListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /places/{placeId}:
    get:
      tags: [Places]
      summary: 장소 상세 조회
      operationId: getPlace
      parameters:
        - $ref: '#/components/parameters/PlaceId'
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
      responses:
        '200':
          $ref: '#/components/responses/PlaceSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /members/me/saved-places:
    get:
      tags: [Places]
      summary: 저장한 장소 목록 조회
      operationId: getSavedPlaces
      parameters:
        - $ref: '#/components/parameters/PlaceCategory'
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PlaceListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /members/me/saved-places/{placeId}:
    put:
      tags: [Places]
      summary: 장소 저장
      operationId: savePlace
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Places]
      summary: 저장한 장소 삭제
      operationId: deleteSavedPlace
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /missions/nearby:
    get:
      tags: [Missions]
      summary: 주변 미션 조회
      operationId: getNearbyMissions
      parameters:
        - $ref: '#/components/parameters/LatitudeRequired'
        - $ref: '#/components/parameters/LongitudeRequired'
        - name: tripId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/MissionListSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /missions/{missionId}:
    get:
      tags: [Missions]
      summary: 미션 상세 조회
      operationId: getMission
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/LatitudeRequired'
        - $ref: '#/components/parameters/LongitudeRequired'
      responses:
        '200':
          $ref: '#/components/responses/MissionDetailSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /mission-photos/presigned-url:
    post:
      tags: [Missions]
      summary: 사진 인증 이미지 업로드 URL 발급
      description: |
        S3에 사진을 직접 업로드할 수 있는 Presigned PUT URL을 발급한다.
        클라이언트는 API 인증 헤더나 multipart 형식 없이 응답의 uploadUrl로 파일 원본 바이트를 PUT한다.
        응답의 headers는 S3 요청에 그대로 포함해야 하며, 업로드 성공 상태 코드는 200이다.
        업로드 후 발급받은 photoId를 미션 제출 API에 전달한다.
      operationId: createMissionPhotoUploadUrl
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionPhotoUploadUrlRequest'
      responses:
        '201':
          $ref: '#/components/responses/MissionPhotoUploadUrlSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '409':
          $ref: '#/components/responses/Conflict'
  /missions/{missionId}/submissions:
    post:
      tags: [Missions]
      summary: 미션 답안 또는 사진 인증 제출
      description: |
        미션 유형에 맞는 답안만 전달한다. PHOTO 유형은 Presigned URL 발급 시 받은 photoId가 필수다.
        서버는 S3 객체의 소유자, 실제 크기, Content-Type을 발급 요청 정보와 대조한 뒤 미션을 처리한다.
        미션을 처음 완료하면 연결된 문화재의 방문 기록을 해당 여행에 한 번만 생성한다.
        같은 여행에서 같은 문화재에 연결된 다른 미션을 완료해도 방문 기록은 중복 생성하지 않는다.
      operationId: submitMission
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionSubmissionRequest'
      responses:
        '200':
          $ref: '#/components/responses/MissionSubmissionSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /members/me/points:
    get:
      tags: [Points]
      summary: 포인트 잔액 조회
      operationId: getMyPointBalance
      responses:
        '200':
          $ref: '#/components/responses/PointSummarySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /members/me/point-transactions:
    get:
      tags: [Points]
      summary: 포인트 내역 조회
      operationId: getMyPointTransactions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PointTransactionListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /members/me/badges:
    get:
      tags: [Badges]
      summary: 배지 진척도 목록 조회
      operationId: getMyBadges
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BadgeCategory'
      responses:
        '200':
          $ref: '#/components/responses/BadgeListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /members/me/badges/{badgeId}:
    get:
      tags: [Badges]
      summary: 배지 상세 조회
      operationId: getMyBadge
      parameters:
        - name: badgeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/BadgeSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /members/me/notifications:
    get:
      tags: [Notifications]
      summary: 알림 목록 조회
      operationId: getMyNotifications
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/NotificationListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /members/me/notifications/{notificationId}:
    patch:
      tags: [Notifications]
      summary: 알림 읽음 처리
      operationId: readNotification
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read:
                  type: boolean
                  const: true
      responses:
        '200':
          $ref: '#/components/responses/NotificationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 키와 같은 요청은 최초 성공 응답을 재사용한다. 같은 키를 다른 요청에 재사용하면 409를 반환한다.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaceId:
      name: placeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MissionId:
      name: missionId
      in: path
      required: true
      schema:
        type: string
